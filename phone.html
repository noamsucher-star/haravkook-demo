<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>כיוון טלפון</title>
<style>
/* דף כיוון לטלפון מהמחשב (25.11.26): הפתיח בגודל טלפון אמיתי באמצע, הלוח בצד. מה שמשנים כאן נשמר רק לטלפון. */
html, body{margin: 0; height: 100%; background: #e9e3d8; font: 400 14px/1.3 "Heebo", Arial, sans-serif; color: #24170b;}
.top{position: fixed; top: 0; right: 0; left: 0; height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #1a1107; color: #f3d998; z-index: 5;}
.top b{font-weight: 400; color: #cdb37c; margin-left: 6px;}
.top button{min-height: 36px; padding: 0 14px; border: 1px solid #b88a3e; background: none; color: inherit; font: inherit; cursor: pointer;}
.top button[aria-pressed="true"]{background: #d9b467; color: #24170b; font-weight: 700;}
.top .rl{margin-right: 18px;}
.stage{position: fixed; top: 52px; bottom: 0; right: 0; left: 300px; display: grid; place-items: center; overflow: hidden;}
.phone{position: relative; transform-origin: center center; border-radius: 44px; padding: 12px; background: #111; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .55);}
.phone iframe{display: block; border: 0; border-radius: 34px; background: #fff;}
#h2c-host{position: fixed; z-index: 6;}
</style>
<style>
/* ================= לוח שליטה ידני לנועם (דמו בלבד): מחשב וטלפון ================= */
.h2c{position: fixed; z-index: 96; top: 76px; left: 12px; width: 268px; max-height: calc(100vh - 150px); overflow: auto; background: rgba(26, 17, 7, .98); color: #f3e2b9; border: 1px solid #b88a3e; font: 400 14px/1.3 "Heebo", Arial, sans-serif; box-shadow: 0 18px 40px -16px rgba(0, 0, 0, .7); direction: rtl; text-align: right;}
.h2c summary{cursor: pointer; padding: 11px 14px; font-weight: 700; font-size: 15px; background: linear-gradient(120deg, #c99a48, #f0d79c 45%, #c99a48); color: #24170b; list-style: none; position: sticky; top: 0; z-index: 1;}
.h2c summary::-webkit-details-marker{display: none;}
.h2c .bd{padding: 6px 14px 14px;}
.h2c h4{font: 700 13px/1 "Heebo", Arial, sans-serif; color: #e9cf94; margin: 14px 0 6px; padding-bottom: 5px; border-bottom: 1px solid rgba(184, 138, 62, .45); letter-spacing: 0;}
.h2c label{display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; margin: 7px 0;}
.h2c label output{font-variant-numeric: tabular-nums; color: #cdb37c; font-size: 12.5px;}
.h2c input[type="range"]{grid-column: 1 / -1; width: 100%; accent-color: #d9b467; height: 26px; margin: 0;}
.h2c select{grid-column: 1 / -1; width: 100%; padding: 7px 8px; background: #2c1d0d; color: #f3e2b9; border: 1px solid #6b4f24; font: inherit;}
.h2c .acts{display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px;}
.h2c button{min-height: 40px; border: 1px solid #b88a3e; background: none; color: #f3e2b9; font: 700 14px "Heebo", Arial, sans-serif; cursor: pointer;}
.h2c button.go{background: #d9b467; color: #24170b;}
.h2c .tip{font-size: 12.5px; color: #cdb37c; margin: 10px 0 0;}
@media (max-width: 900px) {
  /* בטלפון: מגירה מלמטה, כדי שרואים את הפתיח למעלה בזמן שמכוונים */
  .h2c{top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 46vh; border-width: 1px 0 0;}
  .h2c:not([open]){left: auto; right: 50%; transform: translateX(50%); bottom: 8px; border-width: 1px;}
  .h2c:not([open]) summary{padding: 9px 14px; font-size: 14px; white-space: nowrap;}
  .hw-sw{display: none !important;} /* בטלפון שלוש הפריסות זהות; בחירת הפסקה נמצאת בלוח */
}
@media print { .h2c, .hw-sw{display: none;} }
.h2c label.col{grid-template-columns: 1fr 64px;}
.h2c input[type="color"]{width: 64px; height: 32px; padding: 0; border: 1px solid #6b4f24; background: #2c1d0d; cursor: pointer;}
.h2-qm{position: absolute; pointer-events: none; user-select: none; font-family: var(--display); font-weight: 700; line-height: .7; white-space: nowrap; display: none;}
.h2c .cyc{display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;}
.h2c .cyc button{min-height: 40px; font-size: 13.5px;}
.h2c .cyci{margin-top: 6px; min-height: 1.3em;}
</style>
<style>
/* הלוח בצד שמאל, לכל הגובה */
#h2c-host .h2c{top: 52px; left: 0; bottom: 0; width: 300px; max-height: none; border-width: 0 0 0 1px; transform: none; right: auto;}
</style>
</head>
<body>
<div class="top" role="group" aria-label="גודל טלפון">
  <b>גודל טלפון:</b>
  <button type="button" data-w="375" data-h="812">אייפון קטן 375</button>
  <button type="button" data-w="390" data-h="844">אייפון רגיל 390</button>
  <button type="button" data-w="430" data-h="932">אייפון גדול 430</button>
  <button type="button" data-w="360" data-h="780">אנדרואיד 360</button>
  <button type="button" class="rl" data-reload>רענון הטלפון</button>
</div>
<div id="h2c-host"></div>
<div class="stage"><div class="phone"><iframe id="ph" title="הפתיח בגודל טלפון" src="./?ctl=1&amp;embed=1" allow="clipboard-write"></iframe></div></div>
<script>
(function () {
  var fr = document.getElementById('ph'), ph = fr.parentNode, st = document.querySelector('.stage'), cur = { w: 390, h: 844 };
  try { var s = JSON.parse(localStorage.getItem('phone-size') || 'null'); if (s && s.w) cur = s; } catch (e) {}
  function fit() {
    fr.style.width = cur.w + 'px'; fr.style.height = cur.h + 'px';
    var k = Math.min(1, (st.clientHeight - 30) / (cur.h + 24), (st.clientWidth - 30) / (cur.w + 24));
    ph.style.transform = 'scale(' + k + ')';
    [].forEach.call(document.querySelectorAll('.top [data-w]'), function (b) { b.setAttribute('aria-pressed', +b.getAttribute('data-w') === cur.w ? 'true' : 'false'); });
  }
  document.querySelector('.top').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-reload')) { fr.contentWindow.location.reload(); return; }
    cur = { w: +b.getAttribute('data-w'), h: +b.getAttribute('data-h') };
    try { localStorage.setItem('phone-size', JSON.stringify(cur)); } catch (x) {}
    fit();
  });
  addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
